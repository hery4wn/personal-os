<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#253f49"><title>Offline · Personal OS</title>
<style>html{font:16px/1.7 system-ui,sans-serif;color:#293743;background:#edf0f2}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at top left,#f1dacc,transparent 65%),radial-gradient(ellipse at bottom right,#cfe3d9,transparent 65%)}main{margin:24px;padding:30px;max-width:390px;border:1px solid #fff;border-radius:26px;background:#ffffffaa;box-shadow:0 12px 45px #29374310}img{width:72px;height:72px;border-radius:20px}h1{font-size:1.5rem;line-height:1.25}p{color:#596775;font-size:.95rem}button{font:inherit;min-height:48px;padding:10px 20px;border:0;border-radius:13px;background:#b85d48;color:white;cursor:pointer}small{display:block;margin-top:18px;color:#667480}button:focus-visible{outline:3px solid #253f49;outline-offset:4px}@media(prefers-color-scheme:dark){html{background:#152330;color:#e8edf5}body{background:radial-gradient(ellipse at top left,#593e4855,transparent 65%),radial-gradient(ellipse at bottom right,#234c5655,transparent 65%)}main{background:#202c3ddd;border-color:#ffffff25}p,small{color:#b8c6d6}}</style></head>
<body><main><img src="/icons/icon-192.png" alt=""><h1>A little pause.</h1><p>This device can’t reach your workspace. Check your connection and make sure the Personal OS server is running.</p><p>Your saved records stay on the server. Viewing records and saving changes need a connection; edits are not queued offline.</p><button id="retry">Try again</button><small>Personal OS · One day at a time.</small></main><script>document.getElementById('retry').addEventListener('click',()=>{if(location.pathname==='/offline.html')location.replace('/home');else location.reload();});</script></body></html>
